name: Daily news · update and publish

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai (UTC+8)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_sources:
        description: 'Run a live source check without replacing an existing edition'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-news-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check selection, parsing, and archive invariants
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        id: summary-cache
        if: github.event_name != 'push'
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Prepare local Chinese summary model
        if: github.event_name != 'push'
        run: python scripts/prepare_summary.py
      - uses: actions/cache/save@v4
        if: github.event_name != 'push' && steps.summary-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Verify live sources
        if: github.event_name == 'workflow_dispatch' && inputs.verify_sources
        run: python scripts/update.py --dry-run --output .cache/verified-issue.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_sources
        with:
          name: verified-chinese-edition
          path: |
            .cache/verified-issue.json
            .cache/summary/server.log
            .cache/summary/preview.json
          retention-days: 3
      - name: Generate today's edition
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.verify_sources)
        run: python scripts/update.py
      - name: Build static pages
        run: python scripts/build.py
      - name: Check links and generated pages
        run: python scripts/check_site.py
      - name: Save daily data and HTML snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/issues data/history.json site/index.html site/archive.html site/archive site/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish daily edition $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
